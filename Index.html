<!DOCTYPE html>
<html>
<head>
    <title>Website Alif</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f2f6ff;
        }

        nav {
            background: #1769ff;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: #dce9ff;
        }

        h1 {
            color: #1769ff;
        }

        section {
            background: white;
            margin: 20px;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            color: #1769ff;
        }

        button {
            background: #1769ff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- MENU -->
    <nav>
        <a href="#tentang">Tentang</a>
        <a href="#hobi">Hobi</a>
        <a href="#keahlian">Keahlian</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <!-- BERANDA -->
    <header>
        <h1>Halo, Saya Alif 👋</h1>
        <p>Selamat datang di website pribadi saya</p>
    </header>

    <!-- TENTANG -->
    <section id="tentang">
        <h2>👤 Tentang Saya</h2>
        <p>
            Halo! Saya Alif dan saya sedang belajar
            membuat website.
        </p>
    </section>

    <!-- HOBI -->
    <section id="hobi">
        <h2>🎮 Hobi Saya</h2>
        <p>Gaming</p>
        <p>🎵 Mendengarkan musik</p>
        <p>💻 Coding</p>
    </section>

    <!-- KEAHLIAN -->
    <section id="keahlian">
        <h2>💻 Keahlian</h2>
        <p>HTML • CSS • JavaScript</p>
    </section>

    <!-- KONTAK -->
    <section id="kontak">
        <h2>📞 Kontak</h2>

        <button onclick="sapa()">
            Klik Saya
        </button>

        <p id="pesan"></p>
    </section>

    <script>
        function sapa() {
            document.getElementById("pesan").innerHTML =
                "Terima kasih sudah berkunjung! 🎉";
        }
    </script>

</body>
</html>
